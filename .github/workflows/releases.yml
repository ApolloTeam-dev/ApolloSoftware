# Checks the ApolloSoftware layout on every push, keeps the releases table
# in README.md up to date and writes ApolloSoftware.index (from the Info
# files) for ApolloUpdate.
# A new Name without an Info file gets a template one (both OSes
# and, in ApolloSoftware-AVL, Bronze).
# ApolloUpdate.lha is the newest ApolloUpdate, at a fixed address for a
# browser download.
# A second job publishes the web page (releases.py --site, webpage.py) with
# ApolloUpdate.lha to https://apolloteam-dev.github.io/ApolloSoftware/
# The script: .github/scripts/releases.py
#
# A push that only changes README.md / the index does not start it, and its own commit
# (made with GITHUB_TOKEN) never starts another run.

name: Releases table

on:
  push:
    branches: [main]
    paths-ignore: [README.md, ApolloSoftware.index, ApolloUpdate.lha]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: releases-table
  cancel-in-progress: false

jobs:
  table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release order matches ApolloUpdate
        run: python3 .github/scripts/releases.py --selftest

      - name: Check the layout, update the table and the index
        run: python3 .github/scripts/releases.py --create-info --check --readme README.md --index ApolloSoftware.index --package ApolloUpdate.lha

      - name: Commit the table and the index
        run: |
          git add README.md ApolloSoftware.index ApolloUpdate.lha ':(glob)*/*/Info'
          if git diff --cached --quiet; then
            echo "Releases table, index and Info files unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the releases table and ApolloSoftware.index"
          git pull --rebase
          git push

  # The web page for Amiga browsers, with ApolloUpdate.lha beside it, on
  # GitHub Pages. From main as the job above left it (its commit included).
  pages:
    needs: table
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Make the web page
        run: python3 .github/scripts/releases.py --site _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Tell ApolloSoftware-Sources (team only) that this repository changed: a
  # commit into its .github/built-from/ starts its workflow, which rebuilds
  # ApolloSoftware-Overview.pdf. Pushed with a write deploy key of that
  # repository (secret SOURCES_DEPLOY_KEY); skipped without it.
  notify:
    needs: table
    runs-on: ubuntu-latest
    if: ${{ always() && needs.table.result == 'success' }}
    env:
      KEY: ${{ secrets.SOURCES_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.KEY != ''
        with:
          repository: ApolloTeam-dev/ApolloSoftware-Sources
          ssh-key: ${{ secrets.SOURCES_DEPLOY_KEY }}
          path: sources

      - name: Notify ApolloSoftware-Sources
        if: env.KEY != ''
        run: |
          cd sources
          mkdir -p .github/built-from
          echo "${{ github.sha }}" > .github/built-from/ApolloSoftware
          git add .github/built-from/ApolloSoftware
          git diff --cached --quiet && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ApolloSoftware changed: ${{ github.sha }}"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
